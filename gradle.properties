# 指定 JDK 17（Temurin HotSpot，OpenJ9 跑 D8 dexer 会崩）
org.gradle.java.home=J:/Java/jdk17-hotspot
# JVM 参数
org.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=512m -Dfile.encoding=UTF-8 -Duser.home=e:/az/LanIPScannerAndroid
# Kotlin daemon 内存限制
kotlin.daemon.jvmargs=-Xmx1024m -Duser.home=e:/az/LanIPScannerAndroid
# Kotlin daemon 缓存目录（避免沙箱限制）
kotlin.daemon.opts=-Djava.io.tmpdir=e:/az/LanIPScannerAndroid/tmp
# AndroidX 支持
android.useAndroidX=true
# 非传递性 R 类，加速构建
android.nonTransitiveRClass=true
# Kotlin 官方代码风格
kotlin.code.style=official
# Kotlin 编译器在进程内执行，避免 daemon 崩溃
kotlin.compiler.execution.strategy=in-process
# 禁用并行执行，避免 daemon 内存溢出崩溃
org.gradle.parallel=false
